<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Runway media</title>
    <style>
      :root {
        /* Light defaults that match Claude Desktop's cream UI; the host may
           override these via injected CSS custom properties. */
        --bg: var(--color-background-primary, #faf9f5);
        --fg: var(--color-text-primary, #1f1e1d);
        --muted: var(--color-text-secondary, #6b6a66);
        --border: var(--color-border-primary, rgba(0, 0, 0, 0.1));
        --btn-bg: var(--color-bg-100, rgba(0, 0, 0, 0.04));
        --btn-bg-hover: var(--color-bg-200, rgba(0, 0, 0, 0.08));
        --btn-bg-active: var(--color-bg-300, rgba(0, 0, 0, 0.12));
        --media-bg: rgba(0, 0, 0, 0.04);
        --radius: 8px;
        --font-sans: var(
          --font-ui,
          var(
            --font-styrene,
            "Söhne",
            "ui-sans-serif",
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Helvetica,
            Arial,
            sans-serif
          )
        );
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: var(--color-background-primary, #1f1e1d);
          --fg: var(--color-text-primary, #faf9f5);
          --muted: var(--color-text-secondary, #a8a6a1);
          --border: var(--color-border-primary, rgba(255, 255, 255, 0.12));
          --btn-bg: var(--color-bg-100, rgba(255, 255, 255, 0.06));
          --btn-bg-hover: var(--color-bg-200, rgba(255, 255, 255, 0.1));
          --btn-bg-active: var(--color-bg-300, rgba(255, 255, 255, 0.16));
          --media-bg: rgba(255, 255, 255, 0.04);
        }
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-sans);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        min-height: 200px;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        padding: 12px;
      }
      .media {
        width: 100%;
        max-height: 70vh;
        object-fit: contain;
        border-radius: var(--radius);
        background: var(--media-bg);
        display: block;
      }
      audio.media {
        min-height: 54px;
        background: transparent;
      }
      .meta {
        font-size: 13px;
        color: var(--muted);
        word-break: break-word;
      }
      .actions {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 12px;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        color: var(--fg);
        background: var(--btn-bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
        text-decoration: none;
        transition: background 0.15s ease;
      }
      .btn:hover {
        background: var(--btn-bg-hover);
      }
      .btn:active {
        background: var(--btn-bg-active);
      }
      .toast {
        font-size: 12px;
        color: var(--muted);
        opacity: 0;
        transition: opacity 0.2s ease;
      }
      .toast.show {
        opacity: 1;
      }
      .empty {
        padding: 24px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 12px;
        border: 2px solid var(--border);
        border-top-color: var(--fg);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root" class="wrap">
      <div class="empty">Waiting for Runway result…</div>
    </div>

    <script>
      (function () {
        const root = document.getElementById("root");
        let nextId = 1000;
        const pendingCalls = new Map();
        let currentPayload = null;
        // Track whether we've already attempted a refresh for the current
        // URL so a still-broken refresh doesn't loop forever.
        let refreshTried = false;
        let pollTimer = null;
        let pollInFlight = false;
        let pollAttempts = 0;
        const MAX_POLL_ATTEMPTS = 120; // ~10 min at 5s cadence
        const POLL_INTERVAL_MS = 5000;
        const FIRST_POLL_DELAY_MS = 2500;

        function send(method, params, id) {
          const msg = { jsonrpc: "2.0", method };
          if (id !== undefined) msg.id = id;
          if (params !== undefined) msg.params = params;
          window.parent.postMessage(msg, "*");
        }

        function notifySize() {
          const h = Math.max(
            document.documentElement.scrollHeight,
            document.body.scrollHeight,
            300
          );
          send("ui/notifications/size-changed", {
            width: Math.max(window.innerWidth, 320),
            height: h,
          });
        }

        function attachMediaHandlers() {
          const media = root.querySelector("img, video, audio");
          if (!media) return;
          const onload = () => notifySize();
          media.addEventListener("load", onload);
          media.addEventListener("loadedmetadata", onload);
          media.addEventListener("loadeddata", onload);
          media.addEventListener("error", onMediaError);
        }

        function onMediaError() {
          // Likely an expired Runway signed URL. Ask the server for a fresh
          // one via tools/call -> runway_refreshTaskUrl.
          if (!currentPayload || !currentPayload.taskId || refreshTried) {
            showError(
              "This Runway asset is no longer available. It may have been deleted or the task expired."
            );
            return;
          }
          refreshTried = true;
          showLoading("Refreshing link…");
          callTool("runway_refreshTaskUrl", { taskId: currentPayload.taskId }, "refresh");
        }

        function callTool(name, args, kind) {
          const reqId = nextId++;
          pendingCalls.set(reqId, kind);
          send("tools/call", { name, arguments: args }, reqId);
          return reqId;
        }

        function showLoading(msg) {
          root.innerHTML =
            `<div class="empty"><div class="spinner" aria-hidden="true"></div>${msg}</div>`;
          notifySize();
        }

        function showError(msg) {
          stopPolling();
          root.innerHTML = `<div class="empty">${escapeHtml(msg)}</div>`;
          notifySize();
        }

        function failureDetails(payload) {
          if (!payload) return "";
          const message =
            payload.error || payload.failure || payload.failureReason || "";
          const code = payload.failureCode || "";
          if (message && code) return `${message} (${code})`;
          return message || code;
        }

        function stopPolling() {
          if (pollTimer) {
            clearTimeout(pollTimer);
            pollTimer = null;
          }
          pollInFlight = false;
        }

        function isPendingStatus(status) {
          return (
            status === "PENDING" ||
            status === "RUNNING" ||
            status === "THROTTLED" ||
            status === "pending" ||
            !status
          );
        }

        function startPolling(taskId) {
          stopPolling();
          pollAttempts = 0;
          currentPayload = Object.assign({}, currentPayload || {}, {
            taskId,
            status: (currentPayload && currentPayload.status) || "PENDING",
          });
          const kindLabel =
            currentPayload.kind === "video"
              ? "video"
              : currentPayload.kind === "audio"
                ? "audio"
                : "image";
          showLoading(`Generating ${kindLabel}…`);
          schedulePoll(FIRST_POLL_DELAY_MS);
        }

        function schedulePoll(delay) {
          if (pollTimer) clearTimeout(pollTimer);
          pollTimer = setTimeout(pollOnce, delay);
        }

        function pollOnce() {
          if (!currentPayload || !currentPayload.taskId) return;
          if (pollAttempts >= MAX_POLL_ATTEMPTS) {
            showError(
              "Still generating after a long wait. Ask Claude to call runway_getTask with this taskId, or check Runway directly."
            );
            return;
          }
          if (pollInFlight) {
            schedulePoll(POLL_INTERVAL_MS);
            return;
          }
          pollInFlight = true;
          pollAttempts += 1;
          const kindLabel =
            currentPayload.kind === "video"
              ? "video"
              : currentPayload.kind === "audio"
                ? "audio"
                : "image";
          showLoading(
            `Generating ${kindLabel}… (check ${pollAttempts})`
          );
          callTool(
            "runway_getTask",
            { taskId: currentPayload.taskId },
            "poll"
          );
        }

        function handlePollResult(result) {
          pollInFlight = false;
          const payload = extractPayload(result);
          const merged = Object.assign({}, currentPayload || {}, payload || {});
          const status = merged.status;
          const taskId = merged.taskId || (currentPayload && currentPayload.taskId);

          if (payload && payload.url && (status === "SUCCEEDED" || !status)) {
            stopPolling();
            refreshTried = false;
            render(merged);
            return;
          }

          if (status === "FAILED" || status === "CANCELLED") {
            const details = failureDetails(merged);
            showError(
              details
                ? `Generation ${String(status).toLowerCase()}: ${details}`
                : `Generation ${String(status).toLowerCase()}.`
            );
            return;
          }

          if (taskId && isPendingStatus(status)) {
            currentPayload = merged;
            schedulePoll(POLL_INTERVAL_MS);
            return;
          }

          // Unexpected shape — keep trying if we still have a taskId.
          if (taskId) {
            schedulePoll(POLL_INTERVAL_MS);
            return;
          }

          showError(
            "Could not read task status from the poll response. Ask Claude to call runway_getTask with the taskId."
          );
        }

        function render(payload) {
          if (!payload || !payload.url || !payload.kind) {
            showError("No media URL in tool result.");
            return;
          }
          currentPayload = payload;
          stopPolling();
          const escapedUrl = escapeAttr(payload.url);
          const promptLine = payload.prompt
            ? `<div class="meta">${escapeHtml(payload.prompt)}</div>`
            : "";
          if (payload.kind === "video") {
            root.innerHTML =
              `<video class="media" src="${escapedUrl}" controls autoplay muted loop playsinline></video>` +
              promptLine;
          } else if (payload.kind === "audio") {
            root.innerHTML =
              `<audio class="media" src="${escapedUrl}" controls preload="metadata"></audio>` +
              promptLine +
              `<div class="actions"><a class="btn" href="${escapedUrl}" target="_blank" rel="noopener">Download audio</a></div>`;
          } else {
            root.innerHTML =
              `<img class="media" src="${escapedUrl}" alt="Generated image" />` +
              promptLine;
          }
          attachMediaHandlers();
          requestAnimationFrame(notifySize);
        }

        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }

        function escapeAttr(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;");
        }

        function extractFromProse(text) {
          // Claude Desktop sometimes strips structuredContent and only forwards
          // the human-readable content[] text to the iframe. Recover the media
          // URL from the markdown download link we always include in that text.
          const link = text.match(
            /\[Download (image|video|audio)\]\((https?:\/\/[^)\s]+)\)/i
          );
          if (link) {
            const taskMatch = text.match(
              /taskId[=:\s"]+([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i
            );
            return {
              kind: link[1].toLowerCase(),
              url: link[2],
              status: "SUCCEEDED",
              taskId: taskMatch ? taskMatch[1] : undefined,
            };
          }
          // Pending submit text: "Video generation submitted (taskId: UUID, status: PENDING)."
          const pending = text.match(
            /(Image|Video|Audio) generation submitted \(taskId:\s*([0-9a-f-]{36})/i
          );
          if (pending) {
            return {
              kind: pending[1].toLowerCase(),
              taskId: pending[2],
              status: "PENDING",
            };
          }
          const still = text.match(
            /Task\s+([0-9a-f-]{36})\s+is still\s+(PENDING|RUNNING|THROTTLED)/i
          );
          if (still) {
            return { taskId: still[1], status: still[2].toUpperCase() };
          }
          return null;
        }

        function extractPayload(result) {
          if (!result) return null;
          if (result.structuredContent) {
            const sc = result.structuredContent;
            if (sc.url || sc.taskId || sc.status) return sc;
          }
          // Some hosts nest the tool result under .result
          if (result.result && result.result !== result) {
            const nested = extractPayload(result.result);
            if (nested) return nested;
          }
          const content = result.content || [];
          for (const c of content) {
            if (c.type === "text" && typeof c.text === "string") {
              try {
                const parsed = JSON.parse(c.text);
                if (
                  parsed &&
                  (parsed.url || parsed.taskId || parsed.status || parsed.id)
                ) {
                  // Raw Runway task JSON from older getTask responses.
                  if (parsed.id && !parsed.taskId) {
                    parsed.taskId = parsed.id;
                  }
                  if (
                    parsed.status === "SUCCEEDED" &&
                    parsed.output &&
                    parsed.output[0] &&
                    !parsed.url
                  ) {
                    parsed.url = parsed.output[0];
                    if (!parsed.kind) {
                      parsed.kind = /\.(mp4|webm|mov)(\?|$)/i.test(parsed.url)
                        ? "video"
                        : /\.(mp3|wav|m4a|ogg|aac|flac|opus)(\?|$)/i.test(parsed.url)
                          ? "audio"
                          : "image";
                    }
                  }
                  return parsed;
                }
              } catch (_) {
                // not JSON — try scraping the prose fallback below
              }
              const fromProse = extractFromProse(c.text);
              if (fromProse) return fromProse;
            }
          }
          // Whole params object might itself be the structured payload
          if (result.url || result.taskId || result.status) return result;
          return null;
        }

        function handleToolResultPayload(payload) {
          if (!payload) {
            showError(
              "The generation finished but returned no media to display. It may have failed or been moderated — check the chat message, or call runway_getTask with the taskId."
            );
            return;
          }
          // Ready media
          if (payload.url && payload.kind) {
            refreshTried = false;
            render(payload);
            return;
          }
          // Async submit / still running — poll until ready.
          if (payload.taskId && isPendingStatus(payload.status)) {
            currentPayload = Object.assign({}, currentPayload || {}, payload);
            startPolling(payload.taskId);
            return;
          }
          if (payload.status === "FAILED" || payload.status === "CANCELLED") {
            const details = failureDetails(payload);
            showError(
              details
                ? `Generation ${String(payload.status).toLowerCase()}: ${details}`
                : `Generation ${String(payload.status).toLowerCase()}.`
            );
            return;
          }
          showError(
            "The generation finished but returned no media to display. It may have failed or been moderated — check the chat message, or call runway_getTask with the taskId."
          );
        }

        const initId = nextId++;

        // Pull a render payload out of the ui/initialize response. A host may
        // replay the last tool result via hostContext when a view (re)mounts
        // after the tool already finished — e.g. when the assistant message is
        // finalized, or the chat is scrolled and the iframe is recreated.
        // Without this, a recreated view sits on "Waiting…" forever because the
        // one-shot tool-result notification already went to the prior instance.
        function extractFromInit(result) {
          if (!result) return null;
          const ctx = result.hostContext || {};
          return (
            extractPayload(result.toolResult) ||
            extractPayload(ctx.toolResult) ||
            extractPayload(ctx.toolOutput) ||
            extractPayload(result)
          );
        }

        window.addEventListener("message", (event) => {
          const data = event.data;
          if (!data || data.jsonrpc !== "2.0") return;

          if (data.method === "ui/notifications/tool-result") {
            const result =
              data.params && data.params.result
                ? data.params.result
                : data.params;
            refreshTried = false;
            handleToolResultPayload(extractPayload(result));
            return;
          }

          // Host cancelled / timed out the original tool call. Generation tools
          // now return immediately, so this usually means the submit itself was
          // cancelled. If we already have a taskId (partial result / remount),
          // keep polling — the Runway job may still complete.
          if (data.method === "ui/notifications/tool-cancelled") {
            if (currentPayload && currentPayload.taskId && !currentPayload.url) {
              startPolling(currentPayload.taskId);
              return;
            }
            showError(
              "The Runway request was cancelled or timed out before a taskId was returned. Ask again — if a taskId appeared in the chat, call runway_getTask with it instead of starting a new generation."
            );
            return;
          }

          if (data.id === initId && data.result) {
            send("ui/notifications/initialized");
            // If the host replayed a prior result on (re)mount, render/poll it.
            if (!currentPayload || !currentPayload.url) {
              const payload = extractFromInit(data.result);
              if (payload) handleToolResultPayload(payload);
            }
            return;
          }

          // Response to a tools/call we sent (poll or URL refresh).
          if (pendingCalls.has(data.id)) {
            const kind = pendingCalls.get(data.id);
            pendingCalls.delete(data.id);
            if (data.error) {
              if (kind === "poll") {
                pollInFlight = false;
                // Transient host/tool errors — keep trying.
                schedulePoll(POLL_INTERVAL_MS);
                return;
              }
              showError(
                "Couldn't refresh the asset URL. The Runway task may have been deleted."
              );
              return;
            }
            if (kind === "poll") {
              handlePollResult(data.result);
              return;
            }
            const payload = extractPayload(data.result);
            if (payload && payload.url) {
              const merged = Object.assign({}, currentPayload || {}, payload);
              render(merged);
            } else {
              showError("Refresh returned no usable URL.");
            }
          }
        });

        send(
          "ui/initialize",
          {
            protocolVersion: "2026-01-26",
            appCapabilities: {},
            appInfo: { name: "runway-media-viewer", version: "1.2.0" },
          },
          initId
        );

        send("ui/notifications/size-changed", {
          width: Math.max(window.innerWidth, 320),
          height: 220,
        });
      })();
    </script>
  </body>
</html>
